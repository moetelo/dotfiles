
# monitor=eDP-2,preferred,auto,1
# monitor=DP-3,preferred,auto,1
# monitor=,preferred,auto,auto

exec-once = dunst
exec-once = /usr/lib/xfce-polkit/xfce-polkit
exec-once = waybar --config ~/.config/waybar/config-hypr
exec-once = solaar --window=hide
exec-once = hyprpaper
exec-once = hyprpm reload -n

$terminal = alacritty
$fileManager = thunar
$menu = wofi --show drun

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that

# Hardware cursors not yet working on wlroots
env = WLR_NO_HARDWARE_CURSORS,1
# Set wlroots renderer to Vulkan to avoid flickering
env = WLR_RENDERER,vulkan
# General wayland environment variables
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# Firefox wayland environment variable
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_USE_XINPUT2,1
# OpenGL Variables
env = GBM_BACKEND,nvidia-drm
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# Xwayland compatibility
env = XWAYLAND_NO_GLAMOR,1

env = LIBVA_DRIVER_NAME,nvidia
env = DRI_PRIME,pci-0000_01_00_0
env = __VK_LAYER_NV_optimus,NVIDIA_only

env = WLR_DRM_DEVICES,/dev/dri/card0


input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,caps:none
    numlock_by_default = true
    kb_variant =
    kb_model =
    kb_rules =

    follow_mouse = 1

    touchpad {
        tap-to-click = false
        natural_scroll = yes
    }

    sensitivity = -1.0
    repeat_rate = 40
    repeat_delay = 200
}

device {
    name = asuf1204:00-2808:0201-touchpad
    sensitivity = 0
}

general {
    gaps_in = 0
    gaps_out = 0

    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master
    allow_tearing = false
}

decoration {
    rounding = 3

    blur {
        enabled = true
        size = 2
        passes = 1
    }
}

animations {
    enabled = no
}

master {
    mfact = 0.55
    new_on_top = true
}

misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

plugin {
    split-monitor-workspaces {
        count = 9
        enable_notifications = 0
        enable_persistent_workspaces = 0
    }
}

windowrule = border_size 0, match:float 0, match:workspace w[tv1]

$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, E, exit,

bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9] (per-monitor via split-monitor-workspaces)
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9

# Move window between monitors
bind = $mainMod SHIFT, comma, split-changemonitorsilent, prev
bind = $mainMod SHIFT, period, split-changemonitorsilent, next

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, F, fullscreen, 1

# bind = , XF86MonBrightnessUp, exec, brightnessctl-d intel_backlight set +33%
# bind = , XF86MonBrightnessDown, exec, brightnessctl-d intel_backlight set 33%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 1%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 1%-

bind = $mainMod, F7, exec, brightnessctl set 10%-
bind = $mainMod, F8, exec, brightnessctl set 10%+

bind = $mainMod, F11, exec, ddcutil setvcp 10 --bus 18 - 10
bind = $mainMod, F12, exec, ddcutil setvcp 10 --bus 18 + 10
bind = $mainMod Shift, S, exec, flameshot gui

bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Migrated from dwm
bind = $mainMod, S, exec, LC_MONETARY=ru_RU.UTF-8 rofi -show calc
bind = $mainMod, semicolon, exec, bemoji --noline
bind = $mainMod, Tab, layoutmsg, swapwithmaster
bind = $mainMod, backslash, layoutmsg, swapwithmaster
bind = $mainMod, comma, focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1
bind = , XF86KbdBrightnessDown, exec, asusctl --next-kbd-bright
bind = , XF86KbdBrightnessUp, exec, asusctl aura --next-mode
